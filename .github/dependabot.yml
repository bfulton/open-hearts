# The actions the workflows use are pinned to commits (ci.yml); this
# proposes the next release of each, as a pull request a week.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  # Wrangler, which every deploy runs (ops/wrangler): its next release,
  # its whole tree locked, the same way.
  - package-ecosystem: npm
    directory: /ops/wrangler
    schedule:
      interval: weekly
