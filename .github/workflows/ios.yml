# The iOS app and the deal and Schnorr libraries it embeds
# (crypto/build_ios.sh): the XCFrameworks built, the app built for a
# simulator and the libraries loaded there the way the app loads them
# (app/integration_test/native_libs_test.dart), then the release build,
# unsigned, as an archive makes it. Without the libraries an iPhone
# plays no live table.
#
# On a Mac, which is minutes the Linux jobs in ci.yml do not wait on,
# and only when something it builds changed. The repository is public,
# so the minutes cost nothing.
name: ios

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/ios.yml
      - crypto/**
      - app/ios/**
      - app/integration_test/**
      - app/pubspec.*
      - build_phone.sh
      - app/tool/defines.mjs
      - config/**
      - service/functions/deployment.mjs
      - packages/deal/**
      - packages/table/lib/src/schnorr_native*
      - third_party/flutter/**
  push:
    branches: [main]
    paths:
      - .github/workflows/ios.yml
      - crypto/**
      - app/ios/**
      - app/integration_test/**
      - app/pubspec.*
      - build_phone.sh
      - app/tool/defines.mjs
      - config/**
      - service/functions/deployment.mjs
      - packages/deal/**
      - packages/table/lib/src/schnorr_native*
      - third_party/flutter/**

permissions:
  contents: read

concurrency:
  group: ios-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  ios:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: 3.47.2
          cache: true
      # 3.47.2 launches an app on a simulator before the log stream it
      # reads the app's VM service address from is ready, and when the
      # stream starts late it waits for that address with no end
      # (third_party/flutter/README.md). Once the pinned Flutter carries
      # the fix, this step and that folder go.
      - name: Flutter's tool, with its fix for a simulator's log stream (third_party/flutter)
        run: |
          cd "$FLUTTER_ROOT"
          fix="$GITHUB_WORKSPACE/third_party/flutter/simulator_log_stream.patch"
          # A Flutter restored from the cache may have the fix already.
          git apply --reverse --check "$fix" 2> /dev/null || git apply "$fix"
          # An empty stamp has the flutter command build its tool again,
          # from the patched source, before it runs.
          : > bin/cache/flutter_tools.stamp
          flutter --version
          grep -q 'The iOS simulator log stream did not start' bin/cache/flutter_tools.snapshot
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: 1.97.0
          targets: aarch64-apple-ios, aarch64-apple-ios-sim, x86_64-apple-ios
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: |
            crypto/deal
            crypto/schnorr
      - name: The libraries (crypto/build_ios.sh)
        run: crypto/build_ios.sh
      - name: On a simulator (the libraries loaded as the app loads them, and checked)
        id: simulator
        # A run that passes takes about 9 minutes. One that hangs is
        # stopped well inside the job's hour, so that the step after it
        # can say where it was. The three it caught before the fix in
        # third_party/flutter were the tool waiting for the VM service's
        # address.
        timeout-minutes: 25
        run: |
          udid=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          d = json.load(sys.stdin)["devices"]
          print(next(x["udid"] for r, v in sorted(d.items(), reverse=True) if ".iOS-" in r for x in v if x["name"].startswith("iPhone")))')
          echo "udid=$udid" >> "$GITHUB_ENV"
          xcrun simctl boot "$udid"
          cd app && flutter pub get
          # simctl boot returns as the simulator starts; the app goes on
          # one that has finished.
          echo "waiting for the simulator to finish booting"
          xcrun simctl bootstatus "$udid"
          # Every line the tool writes is kept for the step after this
          # one; here, only how the build and the tests went.
          status=0
          flutter test -v integration_test/native_libs_test.dart -d "$udid" > "$RUNNER_TEMP/native_libs.log" 2>&1 || status=$?
          grep -E 'Xcode build done|✅|❌|tests? passed|Some tests failed' "$RUNNER_TEMP/native_libs.log" || true
          exit "$status"
      - name: Where the simulator step stopped, if it failed or hung
        if: always() && (steps.simulator.outcome == 'failure' || steps.simulator.outcome == 'cancelled')
        run: |
          echo "--- the end of the Flutter tool's log"
          tail -n 150 "$RUNNER_TEMP/native_libs.log" || echo "no log: the tests never started"
          echo "--- the simulator"
          xcrun simctl list devices booted || true
          # A test that never ends while the app's event loop runs fails
          # at its timeout (30 s), so one that hangs is stuck in the tool
          # or in a native call; the app's threads say which.
          echo "--- the app's threads"
          pid=$(pgrep -x Runner | head -n 1)
          if [ -n "$pid" ]; then
            sample "$pid" 3 -file "$RUNNER_TEMP/runner.sample.txt" > /dev/null && head -n 200 "$RUNNER_TEMP/runner.sample.txt" || echo "not sampled"
          else
            echo "the app is not running"
          fi
          echo "--- the app's log on the simulator"
          if [ -n "${udid:-}" ]; then
            xcrun simctl spawn "$udid" log show --last 30m --style compact --predicate 'process == "Runner"' | tail -n 150 || true
          fi
      - name: A release without the service key is refused (app/ios/release_check.sh)
        run: |
          cd app
          if flutter build ios --release --no-codesign > ../no-key.log 2>&1; then
            echo "a release built without the service key" >&2; exit 1
          fi
          grep -q "a Release build needs the service key" ../no-key.log || { cat ../no-key.log; exit 1; }
      - name: The release build, unsigned, with what the config names (as build_phone.sh makes it)
        run: |
          node app/tool/defines.mjs app/build/defines.json
          cd app && flutter build ios --release --no-codesign --dart-define-from-file=build/defines.json
      - name: What the release carries
        run: |
          app=app/build/ios/iphoneos/Runner.app
          ls -la "$app/Frameworks"
          for f in deal schnorr; do
            otool -L "$app/Frameworks/$f.framework/$f" | head -3
            lipo -info "$app/Frameworks/$f.framework/$f"
          done
