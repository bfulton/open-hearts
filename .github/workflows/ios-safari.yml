# Real touches in Mobile Safari on an iOS simulator, against the
# deployed app (e2e/ios_safari/probe.py): what each kind of tap leaves
# on the screen, where a desktop browser's emulation of a phone cannot
# show it. Screenshots and a report are kept with the run.
name: ios-safari

on:
  workflow_dispatch:
  push:
    branches: ['claude/**']
    paths:
      - .github/workflows/ios-safari.yml
      - e2e/ios_safari/**

jobs:
  probe:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      # idb's companion is built here, and only with Xcode 26.
      - name: Xcode 26
        run: |
          ls -d /Applications/Xcode*.app
          xcode=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          [[ -n "$xcode" ]] || { echo "no Xcode 26 on this image" >&2; exit 1; }
          sudo xcode-select -s "$xcode"
          xcodebuild -version
      - name: idb
        run: |
          brew tap facebook/fb
          brew install facebook/fb/idb-companion
          python3 -m venv "$RUNNER_TEMP/v"
          "$RUNNER_TEMP/v/bin/pip" install --quiet fb-idb pillow
          echo "$RUNNER_TEMP/v/bin" >> "$GITHUB_PATH"
      - name: A simulator
        run: |
          udid=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          d = json.load(sys.stdin)["devices"]
          print(next(x["udid"] for r, v in sorted(d.items(), reverse=True) if ".iOS-" in r for x in v if x["name"].startswith("iPhone")))')
          xcrun simctl boot "$udid"
          xcrun simctl bootstatus "$udid" -b
          xcrun simctl list devices | grep "$udid"
          idb connect "$udid" || true
          echo "UDID=$udid" >> "$GITHUB_ENV"
      - name: With the accessibility tree (?e2e), which says where things are
        run: python3 e2e/ios_safari/probe.py "$UDID" out/e2e "https://play.openhearts.game/?e2e=1" out/solo.json
      - name: As production, at the same places
        run: python3 e2e/ios_safari/probe.py "$UDID" out/prod "https://play.openhearts.game/" out/solo.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-safari-probe
          path: out/
