# Analyze, test, and prove the web build still builds.
#
# Pull requests and main only: the agent commits many times an hour on a
# working branch, and a build on each one would be noise that costs
# minutes.
name: ci

on:
  pull_request:
  push:
    branches: [main]

# Jobs side by side where there was one: on a hosted runner the table's
# suite alone takes about twenty-five minutes and the relay's two about
# twelve, so one job running everything in turn ran out of time before it
# reached the app. Each builds the Rust libraries its suites load over
# FFI.
#
# And with room for a slow machine. Runners differ: the same table suite
# took 25 minutes on one and 43 on another, every test in it 1.6 to 1.8
# times slower, so each limit here is well clear of the slow end.
jobs:
  app:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.2
          cache: true
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            crypto/deal
            crypto/schnorr
            measurements/ot
      # The deal's cryptography (doc 03): the cdylib the VM tests load.
      # The browser's wasm is committed (app/web/deal.wasm).
      - name: Deal and Schnorr (Rust — the cdylibs for the VM)
        run: |
          cd crypto/deal && cargo build --release && cargo test --release
          cd ../schnorr && cargo build --release && cargo test --release
      # The computation a bot-held seat is played by (doc 04). It is
      # not shipped and nothing imports it, but its tests are what say
      # the protocol is the protocol — that the garbled bot picks the
      # card the bot picks, and that a tampered row is caught — so they
      # run here rather than rot.
      - name: The bot inside the computation (Rust — transfers, triples, garbling)
        run: cd measurements/ot && cargo test --release
      - name: Engine (pure Dart — rules, bots, 200 seeded games)
        run: cd packages/engine && dart pub get && dart analyze && dart test
      - name: Deal (the primitives over FFI, and a hand's deal among four sessions)
        run: cd packages/deal && dart pub get && dart analyze && dart test
      - name: Analyze
        run: cd app && flutter pub get && flutter analyze
      - name: Test (widgets)
        run: cd app && flutter test
      # --no-web-resources-cdn keeps CanvasKit local: the app must render
      # on a filtered network, and the suit pips are drawn paths rather
      # than glyphs for the same reason.
      - name: Build web
        run: |
          cd app
          flutter build web --release --no-web-resources-cdn \
            --base-href /play/

  # In two halves, on two runners: each takes the first or second half
  # of every test file (dart test's shards), about 13 minutes a half, 22
  # on a slow runner.
  table:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1]
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.2
          cache: true
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            crypto/deal
            crypto/schnorr
      - name: Deal and Schnorr (Rust — the cdylibs for the VM)
        run: cd crypto/deal && cargo build --release && cd ../schnorr && cargo build --release
      - name: Table (the protocol over a simulated network — the departure matrix, sealed tables)
        run: cd packages/table && dart pub get && dart analyze && dart test --total-shards 2 --shard-index ${{ matrix.shard }}

  service:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.2
          cache: true
      # The object's relay's socket tests talk through node's own
      # WebSocket, which is there from node 22.
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            crypto/deal
            crypto/schnorr
      - name: Deal and Schnorr (Rust — the cdylibs the relay and the juror load)
        run: cd crypto/deal && cargo build --release && cd ../schnorr && cargo build --release
      - name: Service (the local relay, and a hand played over it with real signatures)
        run: cd service && dart pub get && dart analyze && dart test
      - name: Service, against the object's relay (the same suite, the other implementation)
        run: cd service && OH_RELAY=js dart test
      - name: The object's relay (its own tests, in node's test runner)
        run: node --test service/do/relay.test.mjs service/do/host.test.mjs

  # Four real browsers at one table: the local relay, the built app,
  # WebRTC between headless Chromiums, and the departure cells only a
  # browser can show (e2e/README.md). Then one browser alone against
  # three bot seats the jury holds, for the escrow that opens one when
  # its juror goes.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.2
          cache: true
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            crypto/deal
            crypto/schnorr
      - name: Deal and Schnorr (Rust — the cdylibs the relay and the juror load)
        run: cd crypto/deal && cargo build --release && cd ../schnorr && cargo build --release
      - name: Playwright
        run: npm i -g playwright@1.56.1 && npx playwright install --with-deps chromium
      - name: Build the app for the suite
        run: cd app && flutter pub get && cd .. && ./e2e/build.sh
      - name: Handlers (the Pages worker, in node's test runner)
        run: node --test service/functions/worker.test.mjs
      - name: The page's deal worker (in node's test runner, against the committed wasm)
        run: node --test e2e/deal_worker.test.mjs
      - name: The service worker that keeps the app for a load with no network (in node's test runner)
        run: node --test e2e/offline_worker.test.mjs
      - name: Relay dependencies
        run: cd service && dart pub get
      - name: Four browsers, one table
        run: node e2e/run.mjs
      - name: A bot seat's juror goes, and the escrow opens the seat
        run: node e2e/escrow.mjs
