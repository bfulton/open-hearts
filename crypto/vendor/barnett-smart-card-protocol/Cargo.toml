[package]
name = "barnett-smart-card-protocol"
version = "0.1.0"
edition = "2021"

# Open Hearts: vendored from geometryxyz/mental-poker at b1313f3 (see
# ../README.md). Its sibling crates are the vendored ones beside it, not
# the ssh URLs upstream names; its examples are left out.

[dependencies]
anyhow = "1.0.55"
ark-crypto-primitives = "0.3.0"
ark-ec = "0.3.0"
ark-ff = "0.3.0"
ark-marlin = "0.3.0"
ark-serialize = "0.3.0"
ark-std = { version = "0.3.0", features = ["std"] }
blake2 = { version = "0.9", default-features = false }
merlin = "3.0.0"
proof-essentials = { path = "../proof-essentials" }
rand = "0.8.4"
starknet-curve = { path = "../starknet-curve" }
thiserror = "1.0.30"
