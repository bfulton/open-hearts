# The vendored crates, built and tested together (README.md):
#
#     cd crypto/vendor && cargo test --release
#
# The deal (crypto/deal) takes them by path, with a lock of its own.
[workspace]
resolver = "2"
members = ["starknet-curve", "proof-essentials", "barnett-smart-card-protocol"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
