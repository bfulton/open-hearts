[package]
name = "proof-essentials"
version = "0.1.0"
edition = "2021"

[dependencies]
ark-crypto-primitives = "0.3.0"
ark-ec = "0.3.0"
ark-ff = "0.3.0"
ark-marlin = "0.3.0"
ark-serialize = "0.3.0"
ark-std = { version = "0.3.0", features = ["std"] }
merlin = "3.0.0"
rand = "0.8.4"
starknet-curve = { path = "../starknet-curve" }
thiserror = "1.0.30"
blake2 = { version = "0.9", default-features = false }
digest = { version = "0.9" }

# Open Hearts: no getrandom on wasm — every random value comes in as a
# seed the caller drew, and the feature dragged wasm-bindgen imports in.

[dev-dependencies]
criterion = "0.3"
wasm-bindgen-test = "0.3.29"

[[bench]]
name = "shuffle"
harness = false
