[package]
name = "deal"
version = "0.1.0"
edition = "2021"
publish = false
license = "MIT"
description = "The verifiable deal (docs/explanation/fair-deal.md): Barnett–Smart mental poker with a Bayer–Groth shuffle argument, as flat byte functions for the app's wasm and the VM's FFI"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# The reference crates, vendored (crypto/vendor) and ported to arkworks
# 0.6 with every byte on the wire as 0.3 made it (tests/golden.rs):
# Barnett–Smart, the proof library and the curve.
barnett-smart-card-protocol = { path = "../vendor/barnett-smart-card-protocol" }
proof-essentials = { path = "../vendor/proof-essentials" }
starknet-curve = { path = "../vendor/starknet-curve" }
ark-ec = { version = "0.6.0", features = ["std"] }
ark-ff = { version = "0.6.0", features = ["std"] }
ark-serialize = { version = "0.6.0", features = ["std"] }
ark-std = { version = "0.6.0", features = ["std"] }
rand = "0.8"
rand_chacha = "0.3"
blake2 = { version = "0.10", default-features = false }

# The golden vectors' file (tests/golden.rs).
[dev-dependencies]
serde_json = "1"

# On wasm, rand still wants an entropy source. There is none to give it
# and none is wanted: every random value comes in as a seed the caller
# drew. A custom source that refuses keeps wasm-bindgen out and makes
# any accidental use fail loudly.
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2", features = ["custom"] }

# Its release profile is the workspace's (../Cargo.toml).
