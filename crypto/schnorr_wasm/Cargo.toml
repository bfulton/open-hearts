[package]
name = "schnorr_wasm"
version = "0.1.0"
edition = "2021"
publish = false
license = "MIT"
description = "BIP-340 Schnorr over secp256k1 for the browser and the relay worker: plain exports on linear memory, no bindgen (build.sh writes app/web/schnorr.wasm)"

[lib]
crate-type = ["cdylib"]

[dependencies]
k256 = { version = "0.13", default-features = false, features = ["schnorr", "alloc"] }

[profile.release]
opt-level = "s"
lto = true
panic = "abort"
