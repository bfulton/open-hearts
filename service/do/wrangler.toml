# The per-tag relay (worker.mjs, docs/06-service.md).
#
#   cd service/do && npx wrangler@4 deploy
#
# The signature wasm is the app's own copy, imported from where it
# already lives rather than duplicated here, so there is one file to
# rebuild when the curve code changes; base_dir is the repo root
# because that file is above this directory.
name = "open-hearts-relay"
main = "worker.mjs"
base_dir = "../.."
compatibility_date = "2025-01-01"

# Where the apps find it (app/lib/net/relays.dart, homeTagRelay).
routes = [{ pattern = "relay.openhearts.game", custom_domain = true }]

# The jurors of last resort's image is built from the repo on every
# deploy (service/bench/build.sh): the juror compiled from the table
# code as it is now, never a stage left over from an earlier deploy, so
# the bench always speaks the app's protocol. Needs cargo and dart
# (flutter's bin) on the PATH.
[build]
command = "../bench/build.sh"
cwd = "."

# Logs, the worker's and the jurors' container's own output, kept seven
# days in Workers Logs. Without them a stalled table shows a running
# container and nothing else.
[observability]
enabled = true

# The binding the worker routes through. One object per tag, named by
# the tag itself.
[[durable_objects.bindings]]
name = "TABLE"
class_name = "TagRelay"

# SQLite-backed objects are the ones the free plan carries, and the
# only kind new classes may be. This one stores nothing either way.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["TagRelay"]

# A household's codes, claims and drops, one at a time per subscription
# (docs/06-service.md). Bound to the Pages
# project as HOUSEHOLD (script open-hearts-relay, class Household); it
# reads and writes the project's own store, the same KV namespace as
# the Pages project's OH_STORE (open-hearts-store). A HOUSEHOLD bound
# without the store answers 503.
[[migrations]]
tag = "v2"
new_sqlite_classes = ["Household"]

# The jurors of last resort, as a Cloudflare Container (bench.mjs; the
# image is service/bench, built by its build.sh). The presence relay
# above passes a table's call for a juror to it, and it runs only while
# the bench is serving or waiting to be drawn. Built by [build] above on
# every deploy; the bench's identity is the secret OH_JUROR_SECRET
# (64 hex, kept, so the bench has the same four keys after every start).
# standard-1 is half a vCPU and 4 GiB: a deal took 9 s at a whole vCPU
# and 21 s at a quarter (service/tool/bench_check.dart), and the bench
# itself uses about 22 MiB.
[[containers]]
class_name = "Bench"
image = "../bench/Dockerfile"
max_instances = 1
instance_type = "standard-1"

[[durable_objects.bindings]]
name = "BENCH"
class_name = "Bench"

[[migrations]]
tag = "v3"
new_sqlite_classes = ["Bench"]

[[kv_namespaces]]
binding = "OH_STORE"
id = "5b65151de63341dc9f7a9d417c9b6a4e"

# Backup codes are emailed from the Household (docs/06-service.md) by
# Cloudflare's Email Sending, which needs the Workers Paid plan and the
# sending domain onboarded to Email Service. Without them the codes are
# only shown on the devices.
[[send_email]]
name = "EMAIL"

[vars]
OH_MAIL_FROM = "noreply@openhearts.game"

# What the operator watches (docs/06-service.md): a
# line of counts a minute from each object in use — connections,
# events, deliveries, refusals — and nothing about who. Uncomment where
# Workers Analytics Engine is on for the account; without the binding
# the object counts nothing and writes nothing.
# [[analytics_engine_datasets]]
# binding = "OH_METRICS"
# dataset = "open_hearts_relay"
