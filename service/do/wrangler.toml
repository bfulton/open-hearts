# The per-tag relay (worker.mjs, docs/explanation/service.md).
#
#   cd service/do && npx wrangler@4.130.0 deploy
#
# The signature wasm is the app's own copy, imported from where it
# already lives rather than duplicated here, so there is one file to
# rebuild when the curve code changes; base_dir is the repo root
# because that file is above this directory.
name = "open-hearts-relay"
main = "worker.mjs"
base_dir = "../.."
compatibility_date = "2025-01-01"

# Where the apps find it (app/lib/net/relays.dart, ourRelay).
routes = [{ pattern = "relay.openhearts.game", custom_domain = true }]

# The backup jurors' image is built from the repo on every
# deploy (service/bench/build.sh): the juror compiled from the table
# code as it is now, never a stage left over from an earlier deploy, so
# the backup jurors always speak the app's protocol. Needs cargo and dart
# (flutter's bin) on the PATH.
[build]
command = "../bench/build.sh"
cwd = "."

# Which deploy this is. With it the Bench object (bench.mjs) restarts
# backup jurors whose container is still running from an earlier
# deploy: an object's container takes its image when it starts, and no
# rollout replaces it.
[version_metadata]
binding = "CF_VERSION_METADATA"

# Logs, the worker's and the jurors' container's own output, kept seven
# days in Workers Logs. Without them a stalled table shows a running
# container and nothing else.
[observability]
enabled = true

# The binding the worker routes through. One object per tag, named by
# the tag itself.
[[durable_objects.bindings]]
name = "TABLE"
class_name = "TagRelay"

# SQLite-backed objects are the ones the free plan carries, and the
# only kind new classes may be. This one keeps its tag's lobby events
# in its own storage (tag_store.mjs).
[[migrations]]
tag = "v1"
new_sqlite_classes = ["TagRelay"]

# An account's codes, claims, drops and the rest of what changes it,
# one at a time per account, and a subscription's account found in the
# subscription's own turn (docs/explanation/service.md). Bound to the Pages
# project as HOUSEHOLD (script open-hearts-relay, class Household); it
# reads and writes the project's own store, the same KV namespace as
# the Pages project's OH_STORE (open-hearts-store). A HOUSEHOLD bound
# without the store answers 503.
[[migrations]]
tag = "v2"
new_sqlite_classes = ["Household"]

# The relay asks an account's object whether a device's activation is
# still the one in use as the device opens a socket, and the account's
# object tells the relay's to close a superseded device's sockets
# (docs/explanation/service.md, "One device at a time").
[[durable_objects.bindings]]
name = "HOUSEHOLD"
class_name = "Household"

# The backup jurors, as a Cloudflare Container (bench.mjs; the
# image is service/bench, built by its build.sh). The presence relay
# above passes a table's call for a juror to it, and it runs only while
# they are serving or waiting to be drawn. Built by [build] above on
# every deploy; their identity is the secret OH_JUROR_SECRET (64 hex,
# kept, so they have the same four keys after every start).
# standard-1 is half a vCPU and 4 GiB: a deal took 9 s at a whole vCPU
# and 21 s at a quarter (service/tool/bench_check.dart), and the jurors
# themselves use about 22 MiB.
[[containers]]
class_name = "Bench"
image = "../bench/Dockerfile"
max_instances = 1
instance_type = "standard-1"

[[durable_objects.bindings]]
name = "BENCH"
class_name = "Bench"

[[migrations]]
tag = "v3"
new_sqlite_classes = ["Bench"]

[[kv_namespaces]]
binding = "OH_STORE"
id = "5b65151de63341dc9f7a9d417c9b6a4e"

# The pictures subscribers put out at live tables, copied for the
# operator to look at (review.mjs), and the daily email of the new ones,
# at 13:00 UTC (9 in the morning in South Carolina in summer, 8 in
# winter).
[[r2_buckets]]
binding = "OH_PICTURES"
bucket_name = "open-hearts-pictures"

[triggers]
crons = ["0 13 * * *"]

# The model that looks at each new picture as it is copied, and hides
# one that shows nudity or sexual content, violence or gore, or a hate
# symbol (review.mjs).
[ai]
binding = "AI"

# Backup codes are emailed from the Household (docs/explanation/service.md) by
# Cloudflare's Email Sending, which needs the Workers Paid plan and the
# sending domain onboarded to Email Service. Without them the codes are
# only shown on the devices.
[[send_email]]
name = "EMAIL"

[vars]
OH_MAIL_FROM = "noreply@openhearts.game"
# The service's public key, which an activation has to be signed by, is
# read from config/openhearts.json (worker.mjs), not set here.

# What the operator watches (docs/explanation/service.md): a
# line of counts a minute from each object in use — connections,
# events, deliveries, refusals — and nothing about who.
[[analytics_engine_datasets]]
binding = "OH_METRICS"
dataset = "open_hearts_relay"
