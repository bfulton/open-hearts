[package]
name = "shuffle_bench"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
barnett-smart-card-protocol = { git = "https://github.com/geometryxyz/mental-poker.git" }
proof-essentials = { git = "https://github.com/geometryresearch/proof-toolbox.git" }
starknet-curve = { git = "https://github.com/geometryresearch/proof-toolbox.git" }
ark-ff = "0.3.0"
ark-std = { version = "0.3.0", features = ["std"] }
rand = "0.8"
rand_chacha = "0.3"

# The reference crate pins its sibling crates by ssh URL; take them by https.
[patch."ssh://git@github.com/geometryresearch/proof-toolbox.git"]
proof-essentials = { git = "https://github.com/geometryresearch/proof-toolbox.git" }
starknet-curve = { git = "https://github.com/geometryresearch/proof-toolbox.git" }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
