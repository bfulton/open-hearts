[package]
name = "shuffle_bench"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# The reference crates as the deal builds them: vendored, and ported to
# arkworks 0.6 (crypto/vendor/README.md).
barnett-smart-card-protocol = { path = "../../crypto/vendor/barnett-smart-card-protocol" }
proof-essentials = { path = "../../crypto/vendor/proof-essentials" }
starknet-curve = { path = "../../crypto/vendor/starknet-curve" }
ark-ff = "0.6.0"
ark-std = { version = "0.6.0", features = ["std"] }
rand = "0.8"
rand_chacha = "0.3"

# On wasm, rand wants an entropy source and none is wanted: every random
# value comes from a seeded generator. One that refuses keeps the module
# free of imports beyond the host's two.
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2", features = ["custom"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
