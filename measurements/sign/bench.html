<!doctype html>
<meta charset="utf-8">
<title>BIP-340 in the browser</title>
<pre id="out">running…</pre>
<script>
  // Classic script, so it exists before main.dart.js runs.
  window.results = {};
  window.show = () => { document.getElementById('out').textContent = JSON.stringify(window.results); };
  window.maybeDone = () => {
    if (window.results.dart2js && window.results.wasm) document.body.dataset.done = JSON.stringify(window.results);
  };
  window.report = (json) => { window.results.dart2js = JSON.parse(json); window.show(); window.maybeDone(); };
</script>
<script type="module">
  import { loadSchnorr, unhex } from './schnorr.mjs';
  const { results, show, maybeDone } = window;
  (async () => {
    const s = await loadSchnorr(await (await fetch('./schnorr.wasm')).arrayBuffer());
    const sk = unhex('B7E151628AED2A6ABF7158809CF4F3C762E7160F38B4DA56A784D9045190CFEF');
    const pk = unhex('DFF1D77F2A671C5F36183726DB2341BE58FEAE1DA2DECED843240F7B502BA659');
    const N = 200, aux = new Uint8Array(32);
    const msgs = Array.from({ length: N }, (_, i) => { const m = new Uint8Array(32); m[0] = i; m[1] = i >> 8; return m; });
    let t = performance.now();
    const sigs = msgs.map((m) => s.sign(sk, m, aux));
    const sign_ms = (performance.now() - t) / N;
    t = performance.now();
    let good = 0;
    for (let i = 0; i < N; i++) good += s.verify(pk, msgs[i], sigs[i]) ? 1 : 0;
    const verify_ms = (performance.now() - t) / N;
    results.wasm = { sign_ms: +sign_ms.toFixed(3), verify_ms: +verify_ms.toFixed(3), verified: good, of: N };
    show(); maybeDone();
  })();
</script>
<script src="main.dart.js"></script>
