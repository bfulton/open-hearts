[package]
name = "ot_bench"
version = "0.1.0"
edition = "2021"
publish = false
description = "IKNP/KOS oblivious transfer extension, to price doc 04's preprocessing"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
aes = "0.8"
rand = { version = "0.8", default-features = false }
rand_chacha = { version = "0.3", default-features = false }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
