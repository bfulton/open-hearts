name: table
description: The table protocol — signed events, membership, departures, the play chain — over an abstract transport and clock.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.13.2

dependencies:
  bip340: ^0.3.1
  crypto: ^3.0.6
  deal:
    path: ../deal
  engine:
    path: ../engine
  ffi: ^2.1.0
  pointycastle: ^4.0.0
  web_socket_channel: ^3.0.3

dev_dependencies:
  lints: ^5.1.1
  # The simulator its tests and tools run the table on: a package of
  # its own, so none of it ships with the table.
  table_sim:
    path: ../table_sim
  test: ^1.25.0
