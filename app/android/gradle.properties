org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# AGP 9 (settings.gradle.kts) reads only its new DSL and builds Kotlin
# itself unless told not to, and the Flutter Gradle plugin needs the old
# way for both. Flutter's own migrators add these two; see the AGP 9.0
# release notes and https://flutter.dev/go/android-built-in-kotlin-support.
android.newDsl=false
android.builtInKotlin=false
# The QR scanner's ML Kit from Google Play services, downloaded on first
# use, rather than bundled: about 600 KB in the app instead of 3 to 10 MB
# (mobile_scanner's README, "Android").
dev.steenbakker.mobile_scanner.useUnbundled=true
