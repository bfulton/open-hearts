<!DOCTYPE html>
<html>
<head>
  <!-- Replaced by the `--base-href` given to `flutter build`. -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">

  <!-- Without this a phone browser lays the page out at its default
       980 points and scales it down to fit, which is desktop mode, and
       the page comes up small while the app loads. Once it is running,
       Flutter replaces this tag with its own — the same, with zoom up
       to five times allowed, because a page that cannot be zoomed
       fails the people who need it to be (WCAG 1.4.4). This one says
       what that one will, so nothing changes when it is swapped. -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
  <meta name="description" content="Open source, no ads. Play alone or live.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Open Hearts">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <!-- The felt, so the address bar and the boot screen do not flash
       white before the app paints — and the page itself, so what a
       browser shows past the app's edges (behind a translucent
       toolbar, on an overscroll) is the table's colour and not white. -->
  <meta name="theme-color" content="#06231A">
  <style>
    /* A double tap on a canvas is two taps, not a zoom, and a drag past
       the edge of the table is not a rubber band: either one moves what
       you see away from where the app thinks you touched. */
    html, body {
      background: #06231A;
      margin: 0;
      padding: 0;
      height: 100%;
      touch-action: manipulation;
      overscroll-behavior: none;
    }
  </style>
  <title>Open Hearts</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!-- New Relic Browser: errors and load times from production only
       (observability/monitoring.mjs); it does nothing on any other host. -->
  <script src="observability.js"></script>
  <!-- Copying that Safari allows (copy.js, net/copy_web.dart). -->
  <script src="copy.js"></script>
  <!-- Keeps the page at its top, where taps land where they are drawn. -->
  <script src="hold_still.js"></script>
  <!-- A touch probe, off until switched on in About (ui/touch_probe.dart). -->
  <script src="touch_probe.js"></script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
