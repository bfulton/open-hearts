<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">

  <!-- Without this a phone browser lays the page out at its default
       980 points and scales it down to fit, which is desktop mode: the
       table comes out small, and the page can be pinched and panned,
       which moves what you see away from where the app thinks you
       touched. The app is a canvas that does its own scaling, so it
       asks for the device's own width and no zoom of the browser's. -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="description" content="Hearts, open source. Play alone, or live with friends.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Open Hearts">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <!-- The felt, so the address bar and the boot screen do not flash
       white before the app paints — and the page itself, so what a
       browser shows past the app's edges (behind a translucent
       toolbar, on an overscroll) is the table's colour and not white. -->
  <meta name="theme-color" content="#06231A">
  <style>
    /* A double tap on a canvas is two taps, not a zoom, and a drag past
       the edge of the table is not a rubber band: either one moves what
       you see away from where the app thinks you touched. */
    html, body {
      background: #06231A;
      margin: 0;
      padding: 0;
      height: 100%;
      touch-action: manipulation;
      overscroll-behavior: none;
    }
  </style>
  <title>Open Hearts</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
