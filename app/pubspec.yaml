name: open_hearts
description: "Hearts, for phones and the web."
# An app, not a package: never published to pub.dev.
publish_to: 'none'

# The version name and build number (--build-name, --build-number
# override them).
version: 1.0.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  # The app's words in other languages (l10n.yaml, lib/l10n), and the
  # plurals and dates they need.
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.3

  # The rules of Hearts, shared with the service. See packages/engine.
  engine:
    path: ../packages/engine
  shared_preferences: ^2.5.5
  table:
    path: ../packages/table
  deal:
    path: ../packages/deal
  image_picker: ^1.2.3
  image: ^4.10.0
  qr: ^4.0.0
  # Pages opened from the app — the privacy policy and the terms a
  # store's review taps on the subscription page.
  url_launcher: ^6.3.2
  # Live play bought in the App Store and Google Play
  # (lib/net/store_buying.dart); the Android half by name, for Play's
  # own view of a purchase that is still waiting to be paid.
  in_app_purchase: ^3.3.1
  in_app_purchase_android: ^0.5.3
  mobile_scanner: ^7.4.2
  go_router: ^18.0.2
  # Signing in, so a subscription follows the person (net/sign_in.dart).
  # Apple on an iPhone and the web; Google on Android through its own
  # plugin, not google_sign_in, whose web half would load Google's
  # script into every page (net/provider_tokens_io.dart).
  sign_in_with_apple: ^8.2.0
  google_sign_in_android: ^7.2.17
  google_sign_in_platform_interface: ^3.1.0
  age_range_signals: ^0.10.1
  # The store's own prompt for a review, after a game won, on the phones
  # (net/store_review.dart).
  in_app_review: ^2.0.12

dev_dependencies:
  flutter_test:
    sdk: flutter
  # On a phone or its simulator (integration_test/): the native
  # libraries the app carries, loaded the way the app loads them.
  integration_test:
    sdk: flutter
  crypto: ^3.0.0
  fake_async: ^1.3.1
  flutter_lints: ^6.0.0
  # The table over a simulated network, for the tests that play one.
  table_sim:
    path: ../packages/table_sim

flutter:
  # lib/l10n/app_localizations*.dart, from the .arb files beside them.
  generate: true

  uses-material-design: true

  fonts:
    # The reactions' six emoji, for the web (fonts/README.md).
    - family: ReactionEmoji
      fonts:
        - asset: fonts/ReactionEmoji.ttf
