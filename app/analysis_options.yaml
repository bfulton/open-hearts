# The recommended Flutter lints, and the stricter type checks and rules
# the packages keep too; `flutter analyze` runs them.
include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - build/**
    - android/**
    - ios/**
    - web/**
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true

linter:
  rules:
    - comment_references
    - unawaited_futures
    - directives_ordering
    - avoid_unused_constructor_parameters
